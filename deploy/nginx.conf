# BMU Website - Nginx Configuration
# Add this to your Nginx server block or .conf file in cPanel
# Usually at: /etc/nginx/conf.d/ or via cPanel > Nginx Manager

# ── Upstream for Django (WSGI via Passenger) ─────────────────────────────────
upstream bmu_backend {
    server unix:/tmp/passenger.8000.sock;
}

# ── Upstream for Daphne (WebSocket) ──────────────────────────────────────────
upstream bmu_ws {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect HTTP to HTTPS (enable after SSL is set up)
    # return 301 https://$host$request_uri;

    root /home/username/bmu_website/bmu-frontend/dist;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── API requests → Django ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://bmu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Admin panel → Django ──────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://bmu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Public endpoints → Django ─────────────────────────────────────────────
    location /public/ {
        proxy_pass http://bmu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Chat endpoints → Django ───────────────────────────────────────────────
    location /chat/ {
        proxy_pass http://bmu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket → Daphne ────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://bmu_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── Static files ──────────────────────────────────────────────────────────
    location /static/ {
        alias /home/username/bmu_website/bmu-backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/username/bmu_website/bmu-backend/media/;
        expires 7d;
    }

    # ── Frontend (React SPA) ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Favicon & assets ──────────────────────────────────────────────────────
    location ~* \.(ico|png|svg|jpg|jpeg|gif|webp|woff|woff2|ttf|eot|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

