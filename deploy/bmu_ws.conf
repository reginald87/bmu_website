; BMU WebSocket Server - Supervisor Configuration
; Place this in /etc/supervisor/conf.d/bmu_ws.conf
; Then run: supervisorctl reread && supervisorctl update

[program:bmu_ws]
command=%(ENV_APP_DIR)s/venv/bin/daphne -b 127.0.0.1 -p 8001 bmu_backend.asgi:application
directory=%(ENV_APP_DIR)s/bmu-backend
user=%(ENV_USER)s
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=%(ENV_APP_DIR)s/logs/daphne.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=
    DJANGO_SETTINGS_MODULE="bmu_backend.settings",
    PATH="%(ENV_APP_DIR)s/bmu-backend/venv/bin:%(ENV_PATH)s"
